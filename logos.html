<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NutriLens — логотип</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230B0B0C'/%3E%3Cpath d='M14 50V14l21 36V14m0 36h16' fill='none' stroke='%23fff' stroke-width='7'/%3E%3Ccircle cx='48' cy='19' r='5.5' fill='%23BEFF4F'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500;1,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #E8E9ED; --card: #FFFFFF; --fg: #0B0B0C; --mute: #585D6B; --line: #CDD1DA;
      --ink: #0B0B0C; --lime: #BEFF4F; --paper: #E8E9ED;
      --display: 'Roboto Flex', 'Arial Narrow', sans-serif; --serif: 'Cormorant Garamond', Georgia, serif; --mono: 'JetBrains Mono', monospace;
      --ease: cubic-bezier(.16, 1, .3, 1);
    }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0E0F11; --card: #18191D; --fg: #ECEEF2; --mute: #959CAB; --line: #2C2E34; } }
    :root[data-theme="dark"] { --bg: #0E0F11; --card: #18191D; --fg: #ECEEF2; --mute: #959CAB; --line: #2C2E34; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--display); padding: clamp(16px, 4vw, 56px); }
    .kicker { font-family: var(--mono); font-size: 12px; color: var(--mute); }
    .kicker::before { content: '/ '; color: var(--fg); font-weight: 700; }
    h1 { font-size: clamp(56px, 11vw, 170px); line-height: .82; text-transform: uppercase; margin: 14px 0 18px; font-variation-settings: 'wdth' 28, 'wght' 800, 'opsz' 144; }
    .lead { font-family: var(--serif); font-style: italic; font-size: clamp(20px, 2vw, 28px); max-width: 40ch; margin: 0 0 40px; line-height: 1.15; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr)); gap: 16px; }
    .card { background: var(--card); border-radius: 28px; padding: clamp(18px, 2.4vw, 30px); display: grid; gap: 20px; opacity: 0; transform: translateY(40px) rotate(-1deg); animation: in .9s var(--ease) forwards; animation-delay: calc(var(--i) * 90ms); }
    @keyframes in { to { opacity: 1; transform: none; } }
    .head { display: flex; align-items: baseline; gap: 14px; justify-content: space-between; }
    .head h2 { margin: 0; font-size: clamp(30px, 3.4vw, 46px); text-transform: uppercase; line-height: .9; font-variation-settings: 'wdth' 30, 'wght' 780, 'opsz' 144; }
    .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .tile { aspect-ratio: 1; border-radius: 18px; display: grid; place-items: center; background: var(--t); position: relative; overflow: hidden; }
    .tile svg { width: 52%; height: 52%; transition: transform .8s var(--ease); }
    .tile:hover svg { transform: scale(1.12) rotate(-8deg); }
    .tile small { position: absolute; left: 10px; bottom: 8px; font-family: var(--mono); font-size: 10px; color: var(--k); opacity: .55; }
    .paper { --t: #E8E9ED; --k: #0B0B0C; --l: #BEFF4F; --sq: #BEFF4F; --sl: #0B0B0C; }
    .ink { --t: #0B0B0C; --k: #ECEEF2; --l: #BEFF4F; --sq: #BEFF4F; --sl: #0B0B0C; }
    .lime { --t: #BEFF4F; --k: #0B0B0C; --l: #FFFFFF; --sq: #0B0B0C; --sl: #BEFF4F; }
    .lockup { display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-radius: 18px; background: var(--bg); --t: var(--bg); --k: var(--fg); --l: #BEFF4F; --sq: #BEFF4F; --sl: #0B0B0C; flex-wrap: wrap; }
    .lockup svg { width: 52px; height: 52px; flex: none; }
    .sizes { display: flex; align-items: center; gap: 18px; margin-left: auto; }
    .sizes svg:nth-child(1) { width: 32px; height: 32px; } .sizes svg:nth-child(2) { width: 20px; height: 20px; } .sizes svg:nth-child(3) { width: 16px; height: 16px; }
    .wm { font-size: 30px; line-height: 1; }
    .wm-a { text-transform: uppercase; font-variation-settings: 'wdth' 30, 'wght' 820, 'opsz' 144; letter-spacing: .01em; }
    .wm-b { font-variation-settings: 'wdth' 130, 'wght' 760, 'opsz' 72; letter-spacing: -.03em; font-size: 28px; }
    .wm-c b { font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 34px; } .wm-c span { font-family: var(--mono); font-size: 20px; font-weight: 700; letter-spacing: .08em; }
    .wm-d { text-transform: uppercase; font-variation-settings: 'wdth' 26, 'wght' 850, 'opsz' 144; } .wm-d i { font-style: normal; color: #8BCB1E; }
    .wm-e { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 36px; }
    .wm-f { font-variation-settings: 'wdth' 60, 'wght' 760, 'opsz' 72; font-size: 28px; } .wm-f small { display: block; font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--mute); margin-top: 4px; }
    .wm-g { font-family: var(--mono); font-weight: 700; font-size: 24px; letter-spacing: -.02em; }
    .desc { font-family: var(--serif); font-style: italic; font-size: 22px; line-height: 1.15; margin: 0; }
    .pros { display: flex; gap: 8px; flex-wrap: wrap; }
    .pros span { font-size: 13px; padding: 7px 12px; border-radius: 999px; background: var(--bg); display: inline-flex; gap: 8px; align-items: center; }
    .pros span::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #BEFF4F; box-shadow: 0 0 0 1px var(--fg); }
    .num { font-family: var(--mono); font-size: 12px; color: var(--mute); }
    .rec { font-family: var(--mono); font-size: 11px; background: #BEFF4F; color: #0B0B0C; padding: 5px 10px; border-radius: 999px; }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <span class="kicker">NutriLens · идентика · черновик</span>
  <h1>Логотип</h1>
  <p class="lead">Семь направлений для знака. Каждый показан на трёх фонах, рядом с названием и в мелких размерах — вплоть до иконки во вкладке браузера.</p>
  <div class="grid" id="grid"></div>

  <script>
    const S = (inner) => `<svg viewBox="0 0 64 64" aria-hidden="true">${inner}</svg>`;
    const k = 'style="fill:var(--k)"', l = 'style="fill:var(--l)"', t = 'style="fill:var(--t)"';
    const sk = w => `style="fill:none;stroke:var(--k);stroke-width:${w};stroke-linecap:round;stroke-linejoin:round"`;
    const leaf = 'M32 32 C33 22 40 14 51 12 C50 23 42 30 32 32 Z';

    const MARKS = [
      {
        name: 'Линза', wm: '<span class="wm wm-a">NutriLens</span>',
        desc: '«Смотрю на тарелку внимательно». Объектив камеры и тарелка сверху — одна форма. Прямое развитие текущего значка.',
        pros: ['Читается в 16 px', 'Про фото и ИИ', 'Строгий'],
        svg: S(`<circle cx="32" cy="32" r="26" ${sk(6)}/><circle cx="32" cy="32" r="12" ${l}/><circle cx="32" cy="32" r="4.2" ${k}/><path d="M17 23 A17 17 0 0 1 24.5 15.5" ${sk(3.6)}/>`),
      },
      {
        name: 'Укус', wm: '<span class="wm wm-b">nutrilens</span>',
        desc: 'Лаймовый круг, от которого откусили кусочек, — а внутри всё та же линза. Тёплый, живой, сразу про еду.',
        pros: ['Запоминается', 'Дружелюбный', 'Хорош как иконка приложения'],
        svg: S(`<defs><mask id="bite"><rect width="64" height="64" fill="#fff"/><circle cx="39.5" cy="8.5" r="6.5" fill="#000"/><circle cx="47.5" cy="13.5" r="8" fill="#000"/><circle cx="54.5" cy="22.5" r="7.5" fill="#000"/></mask></defs><circle cx="29" cy="35" r="27" ${l} mask="url(#bite)"/><circle cx="29" cy="35" r="10" style="fill:none;stroke:var(--k);stroke-width:5"/><circle cx="29" cy="35" r="3" ${k}/>`),
      },
      {
        name: 'Диафрагма', wm: '<span class="wm wm-c"><b>Nutri</b><span>LENS</span></span>',
        desc: 'Шесть лепестков складываются в диафрагму объектива — и одновременно в цветок или листья салата. Природа и техника в одном знаке.',
        pros: ['Красивый', 'Можно анимировать раскрытие', 'Сложнее в 16 px'],
        svg: S([0, 60, 120, 180, 240, 300].map((a, i) => `<path d="${leaf}" transform="rotate(${a} 32 32)" ${i % 2 ? k : l}/>`).join('') + `<circle cx="32" cy="32" r="4.5" ${t}/>`),
      },
      {
        name: 'Монограмма NL', wm: '<span class="wm wm-d">Nutri<i>/</i>Lens</span>',
        desc: 'Правая ножка N становится ножкой L — одна линия, без отрыва ручки, как подпись в дневнике. Лаймовая точка — взгляд линзы.',
        pros: ['Типографичный', 'Как у журнала', 'Держится в одном цвете'], rec: true,
        svg: S(`<path d="M13 52 V12 L36 52 V12 M36 52 H54" style="fill:none;stroke:var(--k);stroke-width:7;stroke-linejoin:miter;stroke-linecap:butt"/><circle cx="50" cy="17" r="5.5" ${l}/>`),
      },
      {
        name: 'Ложка-лупа', wm: '<span class="wm wm-e">nutri·lens</span>',
        desc: 'Ложка, у которой вместо черпака — увеличительное стекло. Буквально: «разглядеть, что ешь».',
        pros: ['Игра смыслов', 'Понятен без слов', 'Иллюстративный'],
        svg: S(`<ellipse cx="25" cy="25" rx="13.5" ry="17" transform="rotate(-45 25 25)" ${l}/><ellipse cx="25" cy="25" rx="13.5" ry="17" transform="rotate(-45 25 25)" ${sk(5)}/><path d="M36.5 36.5 L55 55" ${sk(8)}/><path d="M16 22 A10 10 0 0 1 21 15" style="fill:none;stroke:var(--k);stroke-width:3;stroke-linecap:round;opacity:.7"/>`),
      },
      {
        name: 'Закладка', wm: '<span class="wm wm-f">NutriLens<small>личный дневник питания</small></span>',
        desc: 'Ленточка-закладка из блокнота с вырезанной линзой. Сразу говорит главное: это твой дневник, а не публичный сервис.',
        pros: ['Про приватность', 'Подходит к позиционированию', 'Чёткий силуэт'],
        svg: S(`<path d="M15 5 H49 V59 L32 46 L15 59 Z" ${k}/><circle cx="32" cy="24" r="10" ${t}/><circle cx="32" cy="24" r="4.5" ${l}/>`),
      },
      {
        name: 'Слэш', wm: '<span class="wm wm-g">/nutrilens</span>',
        desc: 'Тот самый «/» из интерфейса — метки «/ 001», «/ Сегодня». Знак продолжает типографику сайта и выглядит как раздел дневника.',
        pros: ['Связан с интерфейсом', 'Минимализм', 'Самый простой в производстве'],
        svg: S(`<rect x="4" y="4" width="56" height="56" rx="16" style="fill:var(--sq)"/><path d="M38 13 H48 L26 51 H16 Z" style="fill:var(--sl)"/>`),
      },
    ];

    document.getElementById('grid').innerHTML = MARKS.map((m, i) => `
      <article class="card" style="--i:${i}">
        <div class="head"><h2>${m.name}</h2><span>${m.rec ? '<span class="rec">выбран</span> ' : ''}<span class="num">/ 0${i + 1}</span></span></div>
        <div class="tiles">
          <div class="tile paper">${m.svg}<small>светлый</small></div>
          <div class="tile ink">${m.svg}<small>тёмный</small></div>
          <div class="tile lime">${m.svg}<small>лайм</small></div>
        </div>
        <div class="lockup">${m.svg}${m.wm}<span class="sizes">${m.svg}${m.svg}${m.svg}</span></div>
        <p class="desc">${m.desc}</p>
        <div class="pros">${m.pros.map(p => `<span>${p}</span>`).join('')}</div>
      </article>`).join('');
    // одинаковые id масок внутри повторённых svg: делаем уникальными
    document.querySelectorAll('svg').forEach((s, n) => s.querySelectorAll('mask').forEach(mk => {
      const id = mk.id + n; s.querySelectorAll(`[mask="url(#${mk.id})"]`).forEach(e => e.setAttribute('mask', `url(#${id})`)); mk.id = id;
    }));
    try { const th = (JSON.parse(localStorage.getItem('nutrilens.v1') || '{}').settings || {}).theme; if (th && th !== 'auto') document.documentElement.dataset.theme = th; } catch (e) {}
  </script>
</body>
</html>
